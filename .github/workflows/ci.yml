name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read          # read the code; nothing else

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff (syntax errors and undefined names only)
        run: |
          pip install ruff
          ruff check tools --select E9,F63,F7,F82